[project]
name = "finetune-embedding-norwegian"
version = "0.1.0"
description = "Fine-tune Norwegian embedding models using triplet data with sentence-transformers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.4.2",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.4.1",
    "langchain-anthropic>=1.3.3",
    "langchain-core>=1.2.11",
    "llama-index>=0.14.14",
    "llama-index-llms-anthropic>=0.10.8",
    "llama-index-llms-azure-inference>=0.5.1",
    "llama-index-llms-azure-openai>=0.4.2",
    "llama-index-llms-langchain>=0.7.1",
    "matplotlib>=3.10.8",
    "mlflow>=3.8.1",
    "mteb>=2.5.4",
    "peft>=0.18.0",
    "pyyaml>=6.0.2",
    "scipy>=1.16.3",
    "sentence-transformers>=5.2.0",
    "tensorboard>=2.20.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
]
